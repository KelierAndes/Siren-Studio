[workspace]
members = ["crates/audio-core", "crates/siren-cli", "ui-flutter/rust"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT"
authors = ["SirenStudio"]

[workspace.dependencies]
libpulse-binding = "2.29"
libpulse-simple-binding = "2.29"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
rtrb = "0.4"
mdns-sd = "0.21"
opus-head-sys = { version = "0.3.3", default-features = false }
cpal = "0.18.2"
hound = "3.5"
ctrlc = { version = "3.4", features = ["termination"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
