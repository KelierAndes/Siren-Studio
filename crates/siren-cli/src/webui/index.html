<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SirenStudio · 组网</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234fd1c5'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg stroke='%2304110f' stroke-width='4.2' stroke-linecap='round'%3E%3Cpath d='M14 32h3M21 22v20M28 14v36M35 24v16M42 28v8M49 32h1'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    /* Mirrors ui-flutter/lib/ui_kit/theme.dart — the same chassis on all three clients. */
    --bg: #080d12;
    --desk-top: #101820;
    --panel-2: #0b1219;
    --metal-top: #1b2733;
    --metal-bottom: #0e1720;
    --line: rgba(33, 52, 66, 0.9);
    --text: #e7f1f8;
    --muted: #91a7b9;
    --muted-2: #5e7487;
    --teal: #4fd1c5;
    --blue: #38bdf8;
    --amber: #f5b84f;
    --violet: #9b7cff;
    --red: #f87171;
    --green: #35d07f;
    --mono: Consolas, ui-monospace, "SFMono-Regular", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 620px at 18% -10%, var(--desk-top), transparent 62%),
      radial-gradient(900px 520px at 105% 10%, rgba(56, 189, 248, .06), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 22px 20px 40px; }

  /* 顶栏：品牌 / 状态胶囊（含翻页箭头）/ 远端路数 */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .brand { font-size: 12px; letter-spacing: .34em; font-weight: 800; color: var(--muted); flex: 0 0 200px; }
  .statuswrap { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .statuspill {
    display: inline-flex; align-items: center; gap: 9px; height: 32px; padding: 0 18px; min-width: 300px;
    border-radius: 999px; font-size: 12.5px; letter-spacing: .06em; color: var(--text); background: var(--panel-2);
    border: 1px solid rgba(255,255,255,.05);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05);
    white-space: nowrap;
  }
  .statuspill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); flex: 0 0 auto; }
  .statuspill.on .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .statuspill.busy .dot { background: var(--amber); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .nav {
    width: 26px; height: 26px; border-radius: 9px; border: 1px solid var(--line); cursor: pointer;
    background: linear-gradient(180deg, var(--metal-top), var(--metal-bottom));
    color: var(--muted); font-size: 15px; line-height: 1;
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .nav:hover { color: var(--teal); }
  .nav[hidden] { display: none; }
  .remote { flex: 0 0 200px; text-align: right; font-size: 11px; letter-spacing: .1em; color: var(--muted-2); }

  .banner {
    display: none; margin-bottom: 14px; padding: 11px 15px; border-radius: 13px;
    border: 1px solid rgba(248,113,113,.35); background: rgba(248,113,113,.08); color: #ffd0d0; font-size: 12.5px;
  }
  .banner.show { display: block; }

  /* 机箱 */
  .chassis {
    border-radius: 28px; padding: 16px;
    background: linear-gradient(180deg, var(--metal-top), var(--metal-bottom));
    box-shadow: 0 26px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.05);
  }
  .screen {
    position: relative; height: 316px; border-radius: 16px; overflow: hidden; background: #05090d;
    box-shadow: inset 0 3px 10px rgba(0,0,0,.85), inset 0 -1px 0 rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.05);
  }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .rack { display: grid; grid-template-columns: 34px 1fr 1fr 444px 34px; gap: 10px; margin-top: 12px; align-items: stretch; }
  .syscol { display: grid; grid-template-rows: 189px 66px; gap: 13px; min-width: 0; }
  .sysrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; }

  .card {
    border-radius: 16px; padding: 12px 14px; min-width: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.035), transparent 38%), linear-gradient(180deg, var(--metal-top), var(--metal-bottom));
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 12px 26px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .card.dim { opacity: .62; }
  .well {
    border-radius: 10px; background: rgba(4,9,13,.62);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.04);
  }
  .chead { display: flex; align-items: center; gap: 10px; height: 22px; }
  .cname { font-size: 16.5px; font-weight: 800; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); flex: 0 0 auto; }
  .led.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.violet { background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .led.good { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.warn { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .led.bad { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .mutebtn {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); flex: 0 0 auto; padding: 0;
    background: linear-gradient(180deg, var(--metal-top), var(--metal-bottom));
    box-shadow: 0 2px 5px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .mutebtn svg { width: 12px; height: 12px; }
  .mutebtn.muted { background: linear-gradient(180deg, var(--red), rgba(248,113,113,.7)); color: #fff; box-shadow: 0 0 12px rgba(248,113,113,.45); }

  /* 设备卡：单旋钮 + 电平窗 + 路径/丢帧/欠载 */
  .dbody { display: flex; gap: 6px; margin-top: 8px; height: 200px; }
  .knobcol { width: 112px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .knob {
    position: relative; width: 112px; height: 112px; border-radius: 50%; cursor: ns-resize; touch-action: none;
    background: radial-gradient(circle at 50% 118%, rgba(0,0,0,.55), transparent 62%), linear-gradient(180deg, #223040, #131e28);
    box-shadow: 0 10px 22px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.1), inset 0 -3px 8px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.07);
  }
  .knob::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 42px; margin: -40px 0 0 -1.5px;
    border-radius: 2px; background: var(--accent, var(--blue)); box-shadow: 0 0 9px var(--accent, var(--blue));
    transform-origin: 50% 40px; transform: rotate(var(--rot, 0deg));
  }
  .krange { width: 108px; display: flex; justify-content: space-between; margin-top: 2px; font-size: 9.5px; color: var(--muted-2); }
  .klab { margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
  .dright { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .level { padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; height: 118px; }
  .level .lk { font-size: 9.5px; letter-spacing: .08em; color: var(--muted-2); }
  .level .lv { font: 600 22px/1 var(--mono); color: var(--accent, var(--blue)); }
  .level .lv i { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 3px; }
  .lbar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .lbar i { display: block; height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, rgba(79,209,197,.5), var(--teal)); }
  /* 缓冲水位：当前 / 溢出修剪上限，接近上限时变色 */
  .buf { display: flex; align-items: baseline; gap: 4px; font-size: 9px; letter-spacing: .05em; color: var(--muted-2); }
  .buf b { font: 600 11px/1 var(--mono); color: var(--text); }
  .buf b.warm { color: var(--amber); }
  .buf b.hot { color: var(--red); }
  .buf i { font-style: normal; font-size: 9px; color: var(--muted-2); }
  .facts { flex: 1; padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; }
  .fact { display: flex; align-items: baseline; gap: 6px; font-size: 9.5px; color: var(--muted-2); }
  .fact b { margin-left: auto; font: 500 12px/1.15 var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 系统卡（无旋钮） */
  .scard { display: flex; flex-direction: column; min-width: 0; }
  .slabel { display: flex; align-items: baseline; font-size: 10px; font-weight: 700; color: var(--muted-2); margin-top: 9px; }
  .svalue { margin-left: auto; font: 500 11.5px/1 var(--mono); color: var(--muted); }
  input[type="text"] {
    width: 100%; margin-top: 4px; padding: 8px 11px; border-radius: 8px; font: 600 13px/1.2 inherit;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text); outline: none;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5);
  }
  input[type="text"]:focus { border-color: rgba(79,209,197,.5); box-shadow: inset 0 2px 5px rgba(0,0,0,.5), 0 0 0 3px rgba(79,209,197,.1); }
  input[type="text"]:disabled, input[type="range"]:disabled { color: var(--muted); opacity: .6; }
  .seg { display: flex; gap: 6px; margin-top: 4px; }
  .seg button {
    padding: 7px 11px; border-radius: 999px; font: 600 10.5px/1 inherit; cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, var(--metal-top), var(--metal-bottom));
    border: 1px solid rgba(255,255,255,.07); color: var(--muted-2);
    box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .seg button.active { color: #d7fff8; border-color: rgba(79,209,197,.45); background: linear-gradient(180deg, rgba(79,209,197,.22), rgba(79,209,197,.06)); }
  .seg button:disabled { opacity: .55; cursor: default; }
  .readout { padding: 7px 9px; display: flex; flex-direction: column; justify-content: space-between; height: 48px; margin-top: 4px; }
  .readout .fact b { font-size: 11.5px; }
  .bigbtn {
    margin-top: auto; height: 34px; border-radius: 999px; cursor: pointer; font: 700 13px/1 inherit; letter-spacing: .06em;
    border: 1px solid rgba(255,255,255,.09); color: var(--text);
    background: linear-gradient(180deg, rgba(79,209,197,.22), rgba(79,209,197,.05));
    box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .bigbtn.leave { background: linear-gradient(180deg, rgba(248,113,113,.24), rgba(248,113,113,.06)); }
  .bigbtn:disabled { opacity: .55; cursor: default; }

  /* 底栏 */
  .strip {
    display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--panel-2);
    border: 1px solid rgba(255,255,255,.05); box-shadow: inset 0 2px 8px rgba(0,0,0,.5);
  }
  .strip .sg { flex: 1; min-width: 0; }
  .strip .seg { margin-top: 0; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 5px 0 0; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent, var(--teal)) var(--fill, 50%), rgba(255,255,255,.09) var(--fill, 50%));
    box-shadow: inset 0 1px 3px rgba(0,0,0,.6);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 5px;
    background: linear-gradient(180deg, #2a3a4b, #16212c); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 3px 7px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
  }
  input[type="range"]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.09); }
  input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 5px; background: #223040; border: 1px solid rgba(255,255,255,.12); }

  /* IN / OUT 竖排电平 */
  .fader { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .fader .track { position: relative; flex: 1; width: 12px; border-radius: 6px; background: rgba(4,9,13,.7); box-shadow: inset 0 2px 5px rgba(0,0,0,.7); overflow: hidden; }
  .fader .track i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(180deg, var(--accent, var(--teal)), rgba(79,209,197,.3)); }
  .fader .lab { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--muted); }
  .fader .num { font: 500 10.5px/1 var(--mono); color: var(--accent, var(--teal)); }

  .version { margin-top: 14px; text-align: center; font-size: 8.5px; letter-spacing: .3em; color: var(--muted-2); }

  @media (max-width: 1120px) {
    .rack { grid-template-columns: 34px 1fr 1fr 34px; }
    .syscol { grid-column: 1 / -1; grid-template-rows: auto auto; }
    .screen { height: 240px; }
    .brand, .remote { flex-basis: auto; }
  }
  @media (max-width: 720px) {
    .rack { grid-template-columns: 1fr; }
    .fader { flex-direction: row; height: 30px; }
    .fader .track { width: auto; flex: 1; height: 12px; }
    .fader .track i { top: 0; bottom: 0; left: 0; right: auto; width: 0%; height: auto; }
    .sysrow { grid-template-columns: 1fr; }
    .dbody { height: auto; }
    .statuspill { min-width: 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">SIREN MESH</div>
    <div class="statuswrap">
      <button class="nav" id="prevPage" hidden aria-label="上一页">‹</button>
      <div class="statuspill" id="statePill"><i class="dot"></i><span id="stateText">未组网</span></div>
      <button class="nav" id="nextPage" hidden aria-label="下一页">›</button>
    </div>
    <div class="remote" id="remoteCount">0 路远端</div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="chassis">
    <div class="screen"><canvas id="eq"></canvas></div>

    <div class="rack">
      <div class="fader" id="inMeter" style="--accent: var(--teal)">
        <div class="track"><i></i></div>
        <div class="lab">IN</div>
        <div class="num">-48.0</div>
      </div>

      <div class="card" id="slot0"></div>
      <div class="card" id="slot1"></div>

      <div class="syscol">
        <div class="sysrow">
          <div class="card scard">
            <div class="chead">
              <span class="cname">本机</span><i class="led" id="localLed"></i>
              <span class="spacer"></span><span class="svalue" id="localState">未入网</span>
            </div>
            <div class="slabel">节点名称</div>
            <input type="text" id="name" maxlength="48" placeholder="Siren Node">
            <div class="slabel">音源</div>
            <div class="seg" id="sourceSeg">
              <button data-source="tone">测试音</button>
              <button data-source="loopback">系统内录</button>
              <button data-source="mic">麦克风</button>
            </div>
            <div class="slabel">音调<span class="svalue" id="freqValue">440 Hz</span></div>
            <input type="range" id="freq" min="40" max="12000" step="1" value="440" style="--accent: var(--violet)">
          </div>

          <div class="card scard">
            <div class="chead">
              <span class="cname">组网</span><i class="led" id="meshLed"></i>
              <span class="spacer"></span><span class="svalue" id="deviceCount">1 台</span>
            </div>
            <div class="well readout">
              <div class="fact">角色<b id="roleText">等待</b></div>
              <div class="fact">链路<b id="linkText">等待</b></div>
            </div>
            <button class="bigbtn" id="join">加入组网</button>
          </div>
        </div>

        <div class="strip">
          <div class="sg" style="--accent: var(--teal)">
            <div class="slabel" style="margin-top:0">缓冲<span class="svalue" id="targetValue">30 ms</span></div>
            <input type="range" id="targetSlider" min="15" max="100" step="1" value="30">
          </div>
          <div class="sg" style="--accent: var(--amber)">
            <div class="slabel" style="margin-top:0">主增益<span class="svalue" id="masterValue">0.0 dB</span></div>
            <input type="range" id="masterSlider" min="-24" max="12" step="0.5" value="0">
          </div>
          <div class="seg"><button id="outputPill" type="button">本地播放</button></div>
          <div class="seg"><button id="bypassPill" type="button">BYPASS</button></div>
        </div>
      </div>

      <div class="fader" id="outMeter" style="--accent: var(--amber)">
        <div class="track"><i></i></div>
        <div class="lab">OUT</div>
        <div class="num">-48.0</div>
      </div>
    </div>
  </div>

  <div class="version" id="version">SIRENSTUDIO · LINUX WEBUI</div>
</div>

<script>
const state = {
  status: null,
  joinDraft: null,
  outputDraft: null,
  page: 0,
  lastInputAt: 0,
  busy: false,
  error: null,
  bypassed: false,
  gainBeforeBypass: 0,
  counters: {},
  lastIssue: {},
};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

const CURVE_COLORS = ["#5ba7ff", "#ffa23e", "#2fd1c5", "#9b7cff", "#f87171", "#7bd88f"];
const MIX_STREAM_ID = 0xfff0;

function pct(db) {
  if (!Number.isFinite(db)) return 0;
  return Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
}
function dbLabel(db) {
  if (!Number.isFinite(db) || db <= -59.9) return "-60.0";
  return db.toFixed(1);
}
/* 缓冲水位：当前 / 溢出修剪上限（2×目标+10 ms）。接近上限说明抖动正被剪掉。 */
function bufCeiling(stream) {
  return Number(stream?.buffer_max_ms) || 0;
}
function bufLabel(stream) {
  const max = bufCeiling(stream);
  if (max <= 0) return "—";
  return `${Math.round(Number(stream?.buffer_ms) || 0)}<i> / ${Math.round(max)} ms</i>`;
}
function bufClass(stream) {
  const max = bufCeiling(stream);
  if (max <= 0) return "";
  const ratio = (Number(stream?.buffer_ms) || 0) / max;
  return ratio > 0.9 ? "hot" : ratio > 0.7 ? "warm" : "";
}
function formatDb(value) {
  const v = Number(value) || 0;
  return (v > 0 ? "+" : "") + v.toFixed(1);
}
function sourceLabel(source) {
  return { tone: "测试音", loopback: "系统内录", mic: "麦克风", microphone: "麦克风" }[source] || source;
}
function pathLabel(path) {
  return { wifi: "Wi-Fi", bt: "蓝牙", local: "本地" }[path] || (path || "—");
}
function roleLabel(role) { return { hub: "中心", leaf: "节点" }[role] || "等待"; }
function btStateLabel(value) { return { listening: "监听", connected: "已连" }[value] || "等待"; }
function interacting() { return Date.now() - state.lastInputAt < 900; }
function plainName(peer) { return String(peer?.name || "").replace(/ \(mesh\)$/i, ""); }

function streamName(stream, snap) {
  const mix = Number(stream.stream_id) === MIX_STREAM_ID;
  for (const peer of [...(snap?.peers || []), ...(snap?.topology || [])]) {
    if (peer.uid && peer.uid === stream.origin) {
      const name = plainName(peer);
      return mix ? name + " · 混音" : name;
    }
  }
  return mix ? "混音流" : String(stream.label || stream.id);
}

function deviceStreams(snap) {
  return (snap?.center?.streams || []).filter((s) => Number(s.stream_id) !== MIX_STREAM_ID);
}
/* 卡片要包含 0xFFF0 混音流：它是 N−1 转发的唯一观测点，调试缓冲时必须能看见。 */
function slotStreams(snap) {
  return snap?.center?.streams || [];
}

// 信号质量：丢帧或欠载计数一有增长就记一次事件，1 秒内红、4 秒内黄。
function trackHealth(streams) {
  const now = Date.now();
  const seen = new Set();
  for (const stream of streams) {
    const key = String(stream.id);
    seen.add(key);
    const lost = Number(stream.lost_frames) || 0;
    const under = Number(stream.underruns) || 0;
    const prev = state.counters[key];
    if (prev && (lost > prev.lost || under > prev.under)) state.lastIssue[key] = now;
    state.counters[key] = { lost, under };
  }
  for (const key of Object.keys(state.counters)) {
    if (!seen.has(key)) { delete state.counters[key]; delete state.lastIssue[key]; }
  }
}
function healthClass(stream) {
  if (!stream || !stream.active) return "";
  const at = state.lastIssue[String(stream.id)];
  if (!at) return "good";
  const age = Date.now() - at;
  return age < 1000 ? "bad" : age < 4000 ? "warn" : "good";
}

async function post(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  let payload = {};
  try { payload = await res.json(); } catch (_) {}
  if (!res.ok || payload.ok === false) throw new Error(payload.error || ("HTTP " + res.status));
  state.error = null;
  return payload;
}

async function poll() {
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.status = await res.json();
    state.error = state.status.error || null;
  } catch (error) {
    state.error = "无法连接节点服务：" + error.message;
  }
  render();
}

/* 未入网时，名称/音源/音调是本地草稿：/api/status 里的 config 是服务端上次
   入网用的值，每 700 ms 的轮询若直接覆盖表单，用户刚选的音源会被打回上一次
   的设置（表现就是“音源锁死切不动”）。入网/离开的状态变化时草稿才重建。 */
function joinForm() {
  const cfg = (state.status && state.status.config) || {};
  const live = {
    name: cfg.name || "Siren Node",
    source: cfg.source || "loopback",
    freq: Number(cfg.freq || 440),
  };
  if (!state.status || state.status.running || state.status.starting) {
    state.joinDraft = null;
    return live;
  }
  if (!state.joinDraft) state.joinDraft = live;
  return state.joinDraft;
}

function setDraft(patch) {
  joinForm();
  Object.assign(state.joinDraft, patch);
}

function configFromForm() {
  const cfg = state.status?.config || {};
  const form = joinForm();
  return {
    name: (form.name || cfg.name || "Siren Node").trim(),
    source: form.source || cfg.source || "loopback",
    output: state.outputDraft ?? (cfg.output !== false),
    target_ms: Number($("#targetSlider").value) || cfg.target_ms || 30,
    port: cfg.port ?? 47900,
    codec: cfg.codec || "raw",
    frame_ms: cfg.frame_ms ?? 5,
    freq: Number(form.freq) || 440,
    output_sink: cfg.output_sink ?? null,
    peers: cfg.peers || [],
    bt_enabled: cfg.bt_enabled ?? true,
    bt_channel: Number(cfg.bt_channel || 16),
  };
}

/* 设备卡 */
function slotMarkup(index, stream, snap) {
  const name = stream ? esc(streamName(stream, snap)) : "等待节点";
  const gain = stream ? Number(stream.gain_db) || 0 : -60;
  const muted = Boolean(stream?.muted);
  const accent = CURVE_COLORS[index % CURVE_COLORS.length];
  const rot = (-140 + ((gain + 60) / 72) * 280).toFixed(1);
  return `
    <div class="chead">
      <span class="cname" title="${name}">${name}</span>
      <span class="spacer"></span>
      <i class="led ${stream?.active ? "on" : ""}" title="连接状态"></i>
      <i class="led ${healthClass(stream)}" title="信号质量"></i>
      <button class="mutebtn ${muted ? "muted" : ""}" data-action="mute" title="${muted ? "取消静音" : "静音"}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 10v4h3l4 3V7L7 10H4z"/>
          ${muted ? '<path d="M16 9l5 6M21 9l-5 6"/>' : '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/>'}
        </svg>
      </button>
    </div>
    <div class="dbody">
      <div class="knobcol" style="--accent: ${accent}">
        <div class="knob" data-action="gain" data-gain="${gain}" style="--rot: ${rot}deg"></div>
        <div class="krange"><span>-60</span><span>+12</span></div>
        <div class="klab">增益</div>
      </div>
      <div class="dright">
        <div class="well level" style="--accent: ${accent}">
          <span class="lk">当前电平</span>
          <span class="lv">${dbLabel(stream?.rms_db)}<i>dB</i></span>
          <div class="lbar"><i style="width:${pct(stream?.rms_db)}%"></i></div>
          <div class="buf">缓冲<b class="${bufClass(stream)}">${bufLabel(stream)}</b></div>
        </div>
        <div class="well facts">
          <div class="fact">路径<b>${stream ? esc(pathLabel(stream.path)) : "—"}</b></div>
          <div class="fact">丢帧<b>${stream ? (Number(stream.lost_frames) || 0) : 0}</b></div>
          <div class="fact">欠载<b>${stream ? (Number(stream.underruns) || 0) : 0}</b></div>
        </div>
      </div>
    </div>`;
}

function renderSlots(snap) {
  const streams = slotStreams(snap);
  const pages = Math.max(1, Math.ceil(streams.length / 2));
  if (state.page > pages - 1) state.page = pages - 1;
  for (let i = 0; i < 2; i++) {
    const slot = $("#slot" + i);
    const stream = streams[state.page * 2 + i];
    const key = String(stream?.id ?? "none");
    slot.classList.toggle("dim", !stream || !stream.active || Boolean(stream.muted));
    if (slot.dataset.stream !== key || interacting()) {
      if (slot.dataset.stream !== key) {
        slot.dataset.stream = key;
        slot.innerHTML = slotMarkup(i, stream, snap);
      }
    } else {
      const level = $(".lv", slot);
      if (level) level.innerHTML = dbLabel(stream?.rms_db) + "<i>dB</i>";
      const bar = $(".lbar i", slot);
      if (bar) bar.style.width = pct(stream?.rms_db) + "%";
      const buf = $(".buf b", slot);
      if (buf) {
        const html = bufLabel(stream);
        if (buf.innerHTML !== html) buf.innerHTML = html;
        buf.className = bufClass(stream);
      }
      const facts = slot.querySelectorAll(".fact b");
      if (facts.length === 3) {
        facts[0].textContent = stream ? pathLabel(stream.path) : "—";
        facts[1].textContent = stream ? (Number(stream.lost_frames) || 0) : 0;
        facts[2].textContent = stream ? (Number(stream.underruns) || 0) : 0;
      }
      const name = $(".cname", slot);
      if (name && stream) { const text = streamName(stream, snap); if (name.textContent !== text) name.textContent = text; }
      const leds = slot.querySelectorAll(".led");
      if (leds.length === 2) {
        leds[0].className = "led " + (stream?.active ? "on" : "");
        leds[1].className = "led " + healthClass(stream);
      }
    }
  }
  $("#prevPage").hidden = pages <= 1;
  $("#nextPage").hidden = pages <= 1;
}

/* EQ 曲线 */
const RULER = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 16000];
const MIN_HZ = 20, MAX_HZ = 16000;
const hzToX = (hz) => Math.log(hz / MIN_HZ) / Math.log(MAX_HZ / MIN_HZ);

function drawEq(snap) {
  const canvas = $("#eq");
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  const plot = { left: 14, right: w - 14, top: 34, bottom: h - 16 };
  const font = getComputedStyle(document.body).fontFamily;
  ctx.strokeStyle = "rgba(145,167,185,.16)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = plot.top + ((plot.bottom - plot.top) * i) / 4;
    ctx.beginPath(); ctx.moveTo(plot.left, y); ctx.lineTo(plot.right, y); ctx.stroke();
  }
  ctx.fillStyle = "rgba(145,167,185,.6)";
  ctx.font = "9.5px " + font;
  ctx.textAlign = "center";
  for (const hz of RULER) {
    const x = plot.left + hzToX(hz) * (plot.right - plot.left);
    ctx.beginPath(); ctx.moveTo(x, plot.top); ctx.lineTo(x, plot.top + 5); ctx.stroke();
    ctx.fillText(hz >= 1000 ? (hz / 1000) + "k" : String(hz), x, plot.top - 12);
  }
  ctx.fillStyle = "rgba(145,167,185,.16)";
  ctx.font = "700 17px " + font;
  ctx.fillText("S I R E N :", (plot.left + plot.right) / 2, plot.top + 50);

  const streams = deviceStreams(snap);
  let legendX = plot.left + 2;
  streams.forEach((stream, index) => {
    const color = CURVE_COLORS[index % CURVE_COLORS.length];
    const bands = stream.spectrum || [];
    const gain = Math.max(0, Math.min(1.6, Math.pow(10, (Number(stream.gain_db) || 0) / 20)));
    const dim = !stream.active || stream.muted;
    if (bands.length > 1) {
      const points = bands.map((value, b) => {
        const t = (b + 0.5) / bands.length;
        const hz = MIN_HZ * Math.pow(MAX_HZ / MIN_HZ, t);
        const level = Math.max(0, Math.min(1, value * gain));
        return [
          plot.left + hzToX(hz) * (plot.right - plot.left),
          plot.bottom - 1 - level * (plot.bottom - plot.top) * 0.86,
        ];
      });
      ctx.beginPath();
      ctx.moveTo(plot.left, points[0][1]);
      for (const [x, y] of points) ctx.lineTo(x, y);
      ctx.lineTo(plot.right, points[points.length - 1][1]);
      ctx.strokeStyle = color;
      ctx.globalAlpha = dim ? 0.4 : 0.95;
      ctx.lineWidth = 1.8;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.lineTo(plot.right, plot.bottom);
      ctx.lineTo(plot.left, plot.bottom);
      ctx.closePath();
      ctx.globalAlpha = dim ? 0.06 : 0.16;
      ctx.fillStyle = color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (index < 4) {
      const label = streamName(stream, snap);
      ctx.textAlign = "left";
      ctx.font = "600 10px " + font;
      if (legendX + 11 + ctx.measureText(label).width > plot.right) return;
      ctx.fillStyle = color;
      ctx.fillRect(legendX, plot.top + 4, 7, 7);
      ctx.fillStyle = "rgba(231,241,248,.8)";
      ctx.fillText(label, legendX + 11, plot.top + 11);
      legendX += 11 + ctx.measureText(label).width + 14;
    }
  });
}

/* 主渲染 */
function render() {
  const s = state.status;
  const pill = $("#statePill");
  if (!s) {
    pill.className = "statuspill";
    $("#stateText").textContent = "连接中…";
    return;
  }
  const snap = s.snapshot || {};
  const cfg = s.config || {};
  const streams = deviceStreams(snap);
  const origins = new Set(streams.map((x) => x.origin));
  const devices = Math.max((snap.peers?.length || 0) + 1, origins.size + 1);
  trackHealth(snap.center?.streams || []);

  pill.className = "statuspill" + (s.running ? " on" : s.starting ? " busy" : "");
  const pages = Math.max(1, Math.ceil(slotStreams(snap).length / 2));
  $("#stateText").textContent = s.running
    ? (pages > 1 ? `组网中 · ${devices} 台　·　${state.page + 1}/${pages}` : `组网中 · ${devices} 台`)
    : s.starting ? "加入中…" : "未组网";
  $("#remoteCount").textContent = origins.size + " 路远端";
  $("#version").textContent = "SIRENSTUDIO · LINUX WEBUI · v" + (s.version || "");

  const banner = $("#banner");
  banner.classList.toggle("show", Boolean(state.error));
  banner.textContent = state.error || "";

  const form = joinForm();
  const nameInput = $("#name");
  if (document.activeElement !== nameInput) {
    nameInput.value = s.running ? (snap.name || form.name) : form.name;
  }
  nameInput.disabled = Boolean(s.running);
  const source = form.source;
  document.querySelectorAll("#sourceSeg button").forEach((button) => {
    button.classList.toggle("active", button.dataset.source === source);
    button.disabled = Boolean(s.running);
  });
  $("#localLed").className = "led" + (s.running ? " on" : "");
  $("#localState").textContent = s.starting ? "处理中…" : (s.running ? "已入网" : "未入网");
  if (document.activeElement !== $("#freq")) $("#freq").value = Number(form.freq || 440);
  $("#freqValue").textContent = Math.round(Number($("#freq").value) || 440) + " Hz";
  $("#freq").disabled = Boolean(s.running);

  const bt = snap.bt || {};
  $("#meshLed").className = "led" + (s.running ? " violet" : "");
  $("#deviceCount").textContent = (s.running ? devices : 1) + " 台";
  $("#roleText").textContent = roleLabel(bt.role);
  $("#linkText").textContent = s.running ? `${btStateLabel(bt.state)} · ${bt.links ?? 0} 路` : "等待";
  const join = $("#join");
  join.textContent = s.starting ? "加入中…" : (s.running ? "离开组网" : "加入组网");
  join.classList.toggle("leave", Boolean(s.running));
  join.disabled = Boolean(state.busy);

  const target = Math.round(snap.center?.target_ms ?? cfg.target_ms ?? 30);
  const master = Number(snap.center?.master_gain_db ?? 0);
  if (!interacting()) {
    setRange("#targetSlider", target, 15, 100);
    setRange("#masterSlider", master, -24, 12);
  }
  $("#targetValue").textContent = target + " ms";
  $("#masterValue").textContent = formatDb(master) + " dB";
  const outputOn = (state.outputDraft ?? (cfg.output !== false)) !== false;
  $("#outputPill").textContent = outputOn ? "本地播放" : "静默接收";
  $("#outputPill").classList.toggle("active", outputOn);
  $("#bypassPill").classList.toggle("active", state.bypassed);

  setMeter("#inMeter", snap.sender?.tx_rms_db);
  setMeter("#outMeter", snap.center?.master?.rms_db);

  renderSlots(snap);
  drawEq(snap);
}

function setRange(sel, value, min, max) {
  const el = $(sel);
  if (!el) return;
  el.value = value;
  el.style.setProperty("--fill", (((value - min) / (max - min)) * 100).toFixed(1) + "%");
}

function setMeter(sel, db) {
  const el = $(sel);
  if (!el) return;
  $(".track i", el).style.height = pct(db) + "%";
  $(".track i", el).style.width = pct(db) + "%";
  $(".num", el).textContent = dbLabel(db);
}

/* 交互 */
function debounce(key, fn, ms = 300) {
  clearTimeout(state[key]);
  state[key] = setTimeout(fn, ms);
}

function bindKnob(knob, slot) {
  let startY = 0, startGain = 0, dragging = false;
  const apply = (gain) => {
    const value = Math.max(-60, Math.min(12, gain));
    knob.dataset.gain = String(value);
    knob.style.setProperty("--rot", (-140 + ((value + 60) / 72) * 280).toFixed(1) + "deg");
    state.lastInputAt = Date.now();
    const id = slot.dataset.stream;
    debounce("gainTimer", async () => {
      try { await post(`/api/streams/${id}`, { gain_db: value }); }
      catch (error) { state.error = error.message; }
      poll();
    });
  };
  knob.addEventListener("pointerdown", (event) => {
    dragging = true;
    startY = event.clientY;
    startGain = Number(knob.dataset.gain) || 0;
    knob.setPointerCapture(event.pointerId);
  });
  knob.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    apply(startGain - ((event.clientY - startY) / 200) * 72);
  });
  knob.addEventListener("pointerup", () => { dragging = false; state.lastInputAt = 0; poll(); });
  knob.addEventListener("wheel", (event) => {
    event.preventDefault();
    apply(Number(knob.dataset.gain) + (event.deltaY < 0 ? 1 : -1));
  }, { passive: false });
}

function bindStatic() {
  $("#prevPage").addEventListener("click", () => { state.page = Math.max(0, state.page - 1); render(); });
  $("#nextPage").addEventListener("click", () => { state.page = state.page + 1; render(); });

  $("#sourceSeg").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-source]");
    if (!button || button.disabled) return;
    setDraft({ source: button.dataset.source });
    render();
  });
  $("#name").addEventListener("input", (event) => {
    setDraft({ name: event.target.value });
  });
  $("#freq").addEventListener("input", (event) => {
    $("#freqValue").textContent = Math.round(Number(event.target.value)) + " Hz";
    setDraft({ freq: Number(event.target.value) });
  });

  $("#join").addEventListener("click", async () => {
    if (state.busy) return;
    state.busy = true;
    render();
    try {
      // Decide from the server, not from a status that can be up to a poll
      // interval stale: a "join" click that hit a stale "running" read used to
      // post /api/stop and leave the page showing an unjoined node.
      await poll();
      if (state.status?.running) await post("/api/stop", {});
      else await post("/api/start", configFromForm());
    } catch (error) { state.error = error.message; }
    finally { state.busy = false; await poll(); }
  });

  $("#targetSlider").addEventListener("input", (event) => {
    state.lastInputAt = Date.now();
    const value = Number(event.target.value);
    setRange("#targetSlider", value, 15, 100);
    $("#targetValue").textContent = Math.round(value) + " ms";
    debounce("targetTimer", async () => {
      try { await post("/api/controls", { target_ms: value }); }
      catch (error) { state.error = error.message; }
      poll();
    });
  });
  $("#targetSlider").addEventListener("change", () => { state.lastInputAt = 0; poll(); });

  $("#masterSlider").addEventListener("input", (event) => {
    state.lastInputAt = Date.now();
    const value = Number(event.target.value);
    setRange("#masterSlider", value, -24, 12);
    $("#masterValue").textContent = formatDb(value) + " dB";
    debounce("masterTimer", async () => {
      try { await post("/api/controls", { master_gain_db: value }); }
      catch (error) { state.error = error.message; }
      poll();
    });
  });
  $("#masterSlider").addEventListener("change", () => { state.lastInputAt = 0; poll(); });

  $("#outputPill").addEventListener("click", () => {
    const cfg = state.status?.config || {};
    state.outputDraft = !(state.outputDraft ?? cfg.output !== false);
    render();
  });
  $("#bypassPill").addEventListener("click", async () => {
    const current = Number(state.status?.snapshot?.center?.master_gain_db ?? 0);
    state.bypassed = !state.bypassed;
    if (state.bypassed) state.gainBeforeBypass = current;
    const value = state.bypassed ? -60 : state.gainBeforeBypass;
    try { await post("/api/controls", { master_gain_db: value }); }
    catch (error) { state.error = error.message; }
    render();
  });

  for (const slot of [$("#slot0"), $("#slot1")]) {
    slot.addEventListener("click", async (event) => {
      const button = event.target.closest('[data-action="mute"]');
      if (!button) return;
      const id = slot.dataset.stream;
      if (!id || id === "none") return;
      const stream = deviceStreams(state.status?.snapshot).find((s) => String(s.id) === id);
      try { await post(`/api/streams/${id}`, { muted: !stream?.muted }); }
      catch (error) { state.error = error.message; }
      slot.dataset.stream = "";
      poll();
    });
    new MutationObserver(() => {
      const knob = $(".knob", slot);
      if (knob && !knob.dataset.bound) { knob.dataset.bound = "1"; bindKnob(knob, slot); }
    }).observe(slot, { childList: true });
  }

  window.addEventListener("resize", () => {
    if (state.status?.running) drawEq(state.status.snapshot || {});
  });
}

bindStatic();
poll();
setInterval(poll, 700);
</script>
</body>
